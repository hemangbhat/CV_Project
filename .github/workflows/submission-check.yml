name: Submission checks and reports

on:
  push:
    branches: [main]
    paths:
      - 'paper/**/*.tex'
      - 'paper/figures/**'
      - 'src/**'
      - 'sim/**/*.py'
      - 'tests/**'
      - 'audit/verify_paper_results.py'
      - 'audit/replay_submission_runs.py'
      - 'scripts/package_submission.py'
      - 'requirements*.txt'
      - '.github/workflows/submission-check.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: submission-main
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt -r requirements-sim.txt
      - name: Verify numerical tables and authors
        run: |
          set -o pipefail
          python audit/verify_paper_results.py | tee /tmp/submission-tables.txt
      - name: Run project tests
        run: |
          set -o pipefail
          python -m pytest -q | tee /tmp/submission-tests.txt
      - name: Replay representative simulation runs
        run: |
          set -o pipefail
          python -m audit.replay_submission_runs | tee /tmp/submission-replays.txt
      - name: Install report compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-publishers texlive-fonts-recommended poppler-utils
      - name: Compile both layouts
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error -jobname=Vision_Measured_Queue_Tails_Paper main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -jobname=Vision_Measured_Queue_Tails_Paper main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -jobname=Vision_Measured_Queue_Tails_Paper_journal main_journal.tex
          pdflatex -interaction=nonstopmode -halt-on-error -jobname=Vision_Measured_Queue_Tails_Paper_journal main_journal.tex
      - name: Package and render reports
        run: python scripts/package_submission.py
      - name: Record validation evidence
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, subprocess
          parts = ["Submission validation", "Source commit: " + os.environ["SOURCE_COMMIT"],
                   "Run: " + os.environ["RUN_URL"], ""]
          for name in ("tables", "tests", "replays"):
              parts.extend([name.upper(), Path("/tmp/submission-" + name + ".txt").read_text(), ""])
          for name in ("Vision_Measured_Queue_Tails_Paper", "Vision_Measured_Queue_Tails_Paper_journal"):
              parts.append(subprocess.check_output(["pdfinfo", "paper/" + name + ".pdf"], text=True))
          Path("audit/submission_validation.txt").write_text("\n".join(parts))
          PY
      - name: Update generated submission files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/Vision_Measured_Queue_Tails_Paper.pdf paper/Vision_Measured_Queue_Tails_Paper_journal.pdf paper/overleaf_upload.zip paper/previews/conference.jpg paper/previews/journal.jpg audit/submission_validation.txt
          if ! git diff --cached --quiet; then
            git commit -m "Build verified submission reports and Overleaf package"
            git push origin HEAD:main
          fi
